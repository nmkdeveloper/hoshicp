name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Application & Generate Updater Manifest
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HoshiCP ${{ github.ref_name }}'
          releaseBody: 'HoshiCP ~ Cute & Lightning-fast Competitive Programming IDE release.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true # Produces latest.json for auto-updater

      - name: Build Custom Windows Installer & Portable Package
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # 1. Compile custom Rust installer (crates/installer -> HoshiCP-Setup.exe)
          cargo build --release --manifest-path crates/installer/Cargo.toml
          cp crates/installer/target/release/HoshiCP-Setup.exe ./HoshiCP-Setup.exe

          # 2. Package standalone portable binary into HoshiCP-windows-x64.zip
          7z a HoshiCP-windows-x64.zip ./src-tauri/target/release/hoshicp.exe ./public/icon.png

      - name: Upload Windows Custom Installer & Portable Zip
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" HoshiCP-Setup.exe HoshiCP-windows-x64.zip --clobber

      - name: Save updater manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/latest.json
            latest.json
          if-no-files-found: ignore

      # Note on non-Windows release artifacts produced by tauri-action:
      # - macOS runner produces HoshiCP.dmg and HoshiCP.app.tar.gz
      # - Linux runner produces HoshiCP.AppImage and HoshiCP.tar.gz
      # All signed updater bundles and latest.json are merged and published to the GitHub Release.

  combine-manifests:
    name: Combine Updater Manifests
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all updater manifest artifacts
        uses: actions/download-artifact@v4
        with:
          path: updater-artifacts

      - name: Merge updater manifests into unified latest.json
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            let merged = {
              version: process.env.GITHUB_REF_NAME ? process.env.GITHUB_REF_NAME.replace(/^v/, "") : "0.1.0",
              notes: "HoshiCP release",
              pub_date: new Date().toISOString(),
              platforms: {}
            };

            function scan(dir) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  scan(full);
                } else if (entry.name.endsWith(".json")) {
                  try {
                    const parsed = JSON.parse(fs.readFileSync(full, "utf8"));
                    if (parsed && parsed.platforms) {
                      merged.version = parsed.version || merged.version;
                      merged.notes = parsed.notes || merged.notes;
                      merged.pub_date = parsed.pub_date || merged.pub_date;
                      Object.assign(merged.platforms, parsed.platforms);
                    }
                  } catch (e) {
                    console.error("Skipping file " + full + ":", e.message);
                  }
                }
              }
            }

            scan("updater-artifacts");
            fs.writeFileSync("latest.json", JSON.stringify(merged, null, 2));
            console.log("Unified latest.json:\n", JSON.stringify(merged, null, 2));
          '

      - name: Upload unified latest.json to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" latest.json --clobber
