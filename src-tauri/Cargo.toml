[package]
name = "hoshicp"
version = "0.1.0"
description = "HoshiCP"
authors = ["nmkdeveloper"]
edition = "2021"

[lib]
name = "hoshicp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
